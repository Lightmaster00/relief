<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F2FB"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)"/>
  <!-- Arrow centred between the two icons. Finder draws an icon about 17 pt above its
